name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # 手動実行を可能にする

jobs:
  # バックエンドのテスト
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: laravel_vue_dashboard_dc_test
        ports:
          - 3307:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Install MariaDB client
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Create storage directories
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/testing
          mkdir -p storage/framework/views
          mkdir -p storage/app/public
          mkdir -p storage/logs
          chmod -R 777 storage
          chmod -R 777 bootstrap/cache

      - name: Copy .env file
        run: cp .env.testing.ci .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Set testing environment
        run: |
          sed -i 's/DB_PORT=3306/DB_PORT=3307/g' .env

      - name: Run database migrations
        run: php artisan migrate:fresh --seed

      - name: Run backend tests
        run: vendor/bin/pest

  # フロントエンドのテスト
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm test


